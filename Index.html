<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FunFull</title>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: rgba(0, 0, 0, 0.75);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            max-width: 380px;
            width: 100%;
        }
        h2 { margin-bottom: 10px; color: #ffd700; font-size: 24px; }
        
        .media-container {
            margin: 10px 0;
        }
        .custom-media {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #ffd700;
        }

        input[type="text"] {
            width: 65%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            text-align: center;
        }
        .btn-yellow {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-yellow:hover { background: #ffc107; }
        .btn-green {
            background: #2ed573;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .gender-box {
            margin: 20px 0;
            font-size: 18px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .gender-box label {
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            padding: 8px 15px;
            border-radius: 8px;
        }
        .arrow-btn {
            background: #00bfff;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
        }
        .hidden { display: none; }
        
        .qr-box {
            background: #fff;
            color: #333;
            padding: 12px;
            border-radius: 12px;
            margin: 10px 0;
            display: inline-block;
            width: 85%;
        }
        .upload-section {
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 10px;
        }
        .generated-code-box {
            background: #1e1e1e;
            border: 2px dashed #2ed573;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
        }
        .funny-box {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid #ffd700;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- PAGE 1: Main Redeem Code Screen -->
    <div class="card" id="page1">
        <h2>FunFull 😆</h2>
        
        <!-- Gift GIF Section -->
        <div class="media-container">
            <img src="https://media.giphy.com/media/3oKIPnAiaMCws8nOsE/giphy.gif" alt="Gift GIF" class="custom-media">
        </div>
        
        <p style="font-weight: bold; margin-top: 5px;">Entre redeem code</p>
        
        <div style="margin-top: 5px;">
            <span style="font-size: 16px; font-weight: bold;">Code:-</span> 
            <input type="text" id="redeemInput" placeholder="Enter code here">
        </div>
        
        <button class="btn-green" onclick="verifyCode()">Aage Badho ➡️</button>
        <br>
        <button class="btn-yellow" onclick="openPayment()">Click here (Get Code)</button>
    </div>

    <!-- PAYMENT PAGE: QR, Details & Proof Upload -->
    <div class="card hidden" id="paymentPage">
        <h2>Scan & Pay</h2>
        <p style="font-size: 13px; color: #ddd; margin: 0;">₹3 ka payment karein aur screenshot upload karein!</p>
        
        <div class="qr-box">
            <!-- Yahan tera asli UPI ID set kar diya hai -->
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=upi://pay?pa=avtarsajal@fam&pn=FunFull&am=3.00&cu=INR" alt="QR Code" width="130" style="border-radius: 8px;">
            <div style="font-size: 12px; font-weight: bold; margin-top: 5px; color: #000;">
                Name: FunFull Store<br>
                UPI ID: avtarsajal@fam
            </div>
        </div>

        <div class="upload-section">
            <label style="font-size: 12px; display: block; font-weight: bold; margin-bottom: 5px;">Payment Proof (Screenshot):</label>
            <input type="file" id="proofUpload" accept="image/*" style="font-size: 11px; color: #ddd;" onchange="enableVerifyBtn()">
        </div>

        <button class="btn-yellow" id="verifyProofBtn" style="opacity: 0.6; cursor: not-allowed;" disabled onclick="processVerification()">Verify & Get Code 🔄</button>
        
        <!-- Generated Code Display Area -->
        <div class="generated-code-box hidden" id="codeResultBox">
            <p style="margin: 0; font-size: 12px; color: #aaa;">Aapka Redeem Code:</p>
            <h3 id="secretCodeDisplay" style="color: #2ed573; margin: 5px 0; font-size: 22px; letter-spacing: 2px;"></h3>
            <p style="margin: 0; font-size: 10px; color: #ff5e62;">Is code ko copy kar lein!</p>
        </div>
        <br>
        <button class="btn-yellow" style="background: #ff4757; color: white; margin-top: 5px;" onclick="backToHome()">⬅️ Wapas (Code Dalne)</button>
    </div>

    <!-- PAGE 2: Choose Gender & Name -->
    <div class="card hidden" id="page2">
        <h2>Choose your</h2>
        
        <div class="gender-box">
            <label><input type="radio" name="gender" value="male"> Mail [ ]</label>
            <label><input type="radio" name="gender" value="female"> Femail [ ]</label>
        </div>

        <div style="margin-top: 20px;">
            <label style="font-size: 18px; font-weight: bold;">Your name</label>
            <input type="text" id="username" placeholder="Naam likho...">
        </div>

        <button class="arrow-btn" onclick="startJaiJaikaar()">➡️</button>
    </div>

    <!-- PAGE 3: Final Jai Jaikaar Screen -->
    <div class="card hidden" id="successSection">
        <h1 id="greetingText" style="color: #2ed573; font-size: 26px;"></h1>
        <p style="color: #ddd; margin-top: 10px;">Aage ka maza abhi baaki hai! 😎</p>
        
        <button class="btn-yellow" onclick="showSecretPrize()">Asli inam yha h</button>

        <div class="funny-box hidden" id="secretPrizeBox">
            <p id="prankMessage" style="font-size: 15px; margin: 5px 0; color: #fff; font-weight: bold;"></p>
            <button class="btn-green" style="margin-top: 10px; font-size: 12px;" onclick="location.reload()">🔄 Dobara Khelein</button>
        </div>
    </div>

    <script>
        let generatedSecretCode = "JAI-" + Math.floor(1000 + Math.random() * 9000);

        function openPayment() {
            document.getElementById('page1').classList.add('hidden');
            document.getElementById('paymentPage').classList.remove('hidden');
        }

        function backToHome() {
            document.getElementById('paymentPage').classList.add('hidden');
            document.getElementById('page1').classList.remove('hidden');
        }

        function enableVerifyBtn() {
            const fileInput = document.getElementById('proofUpload').value;
            const btn = document.getElementById('verifyProofBtn');
            if(fileInput) {
                btn.removeAttribute('disabled');
                btn.style.opacity = '1';
                btn.style.cursor = 'pointer';
            }
        }

        function processVerification() {
            const btn = document.getElementById('verifyProofBtn');
            btn.innerHTML = "Verifying Proof... ⏳";
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = "Verified Successfully! ✅";
                document.getElementById('codeResultBox').classList.remove('hidden');
                document.getElementById('secretCodeDisplay').innerText = generatedSecretCode;
                document.getElementById('redeemInput').value = generatedSecretCode;
            }, 2000);
        }

        function verifyCode() {
            const code = document.getElementById('redeemInput').value.trim();
            if(code === "") {
                alert("Pehle redeem code daalo bhai!");
                return;
            }
            document.getElementById('page1').classList.add('hidden');
            document.getElementById('page2').classList.remove('hidden');
        }

        let globalTitleName = "";

        function startJaiJaikaar() {
            const genderOptions = document.getElementsByName('gender');
            let selectedGender = "";
            for(let opt of genderOptions) {
                if(opt.checked) {
                    selectedGender = opt.value;
                }
            }

            const name = document.getElementById('username').value.trim();

            if(selectedGender === "") {
                alert("Pehle Mail ya Femail select karo!");
                return;
            }
            if(name === "") {
                alert("Pehle apna naam toh likho!");
                return;
            }

            globalTitleName = (selectedGender === 'male') ? `Maharaj ${name}` : `Maharani ${name}`;

            document.getElementById('page2').classList.add('hidden');
            document.getElementById('successSection').classList.remove('hidden');
            
            document.getElementById('greetingText').innerHTML = `🚩 ${globalTitleName} ki Jai! 🚩`;

            if ("vibrate" in navigator) {
                navigator.vibrate([200, 100, 200, 100, 500]);
            }

            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 7,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });
                confetti({
                    particleCount: 7,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        function showSecretPrize() {
            const exactMsg = "Badhai ho Aap ban chuke hain pure mohalle ke sabse bade legend! 🏆 Matr 3 rupe me...";
            document.getElementById('prankMessage').innerText = exactMsg;
            document.getElementById('secretPrizeBox').classList.remove('hidden');

            confetti({
                particleCount: 40,
                spread: 60,
                origin: { y: 0.6 }
            });
        }
    </script>

</body>
</html>
